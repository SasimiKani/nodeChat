<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<link rel="icon" href="./img/home.png">
	<title>チャットホーム</title>
	<style>
		/* コンテナ全体のスタイル */
		#container {
			max-width: 600px;
			margin: 40px auto;
			padding: 20px;
			background-color: #f4f4f9;
			border-radius: 8px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
			font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
		}

		/* 説明文のスタイル */
		#description {
			font-size: 16px;
			color: #333;
			text-align: center;
			padding: 15px;
			margin-bottom: 20px;
		}
		#description .caution {
			color: red;
		}

		#rid {
			display: block;
			text-align: center;
			padding: 15px 0;
			border-radius: 4px;
		}
		#rid input {
			width: 100%;
			font-size: 18px;
		}

		/* チャットルーム作成ボタンのスタイル */
		#makeRoom {
			display: block;
			cursor: pointer;
			background-color: #28a745;
			color: #fff;
			text-align: center;
			padding: 15px 0;
			border-radius: 4px;
			font-size: 18px;
			font-weight: bold;
			transition: background-color 0.3s ease;
			user-select: none;
		}

		/* ホバー時の背景色変更 */
		#makeRoom:hover {
			background-color: #218838;
		}
		
		/* オーバーレイ */
		#overlayLoad {
			display: none;
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100vh;
			background-color: #0008;
			justify-content: center;
			align-items: center;
			z-index: 9999;
		}
		#overlayLoad.show {
			display: flex;
			flex-flow: row;
		}
		#loadAnimation {
			width: 10rem;    /* スピナーの横幅 */
			height: 10rem;   /* スピナーの高さ */
			border: 1rem solid rgba(255, 255, 255, 0.3); /* 薄い白い枠線 */
			border-top-color: #ffffff;  /* 上部は白 */
			border-radius: 50%;         /* 円形にする */
			animation: load 1s linear infinite; /* 1秒間隔で回転するアニメーション */
		}
		/* アニメーション定義 */
		@keyframes load {
		0% { transform: rotate(0deg); }
		100% { transform: rotate(360deg); }
		}
	</style>
</head>
<body>
	<div id="container">
		<div id="description">
			<p>チャットルーム作成ボタンを押すと新しいチャットルームが作成されます</p>
			<p>チャット画面左上のルームIDをクリック/タップするとURLをコピーできます</p>
			<p class="caution">※すべてのチャット履歴は毎日0時に消去されます</p>
		</div>
		<div id="rid">
			<input placeholder="ルームID（未入力はランダム）">
		</div>
		<div id="makeRoom" onclick="makeRoom()">
			チャットルーム作成
		</div>
	</div>
	<div id="overlayLoad">
		<div id="loadAnimation"></div>
	</div>
	<script>
	async function getExistRid() {
		const overlay = document.querySelector("#overlayLoad")
		overlay.classList.add("show")
		return await new Promise(resolve => {
			fetch("https://nodechat-9dv7.onrender.com/roomList")
			//fetch("http://localhost:3000/roomList")
				.then(res => res.text())
				.then(text => {
					overlay.classList.remove("show")
					resolve(JSON.parse(text))
				})
		})
	}

	function ridGen() {
		const charset = "abcdefghijklmnopqrstuvwxyz0123456789"
		const rand = () => {
			return charset[Math.round(Math.random() * charset.length)]
		}
		rid = Array.from({length: 40}, () => rand()).join("")
		return rid
	}
	
	function makeRoom() {
		getExistRid().then(ridList => {
			let rid = document.querySelector("#rid input").value
			if (ridList.includes(rid)) {
				alert("そのルームIDはすでに使われています")
				return false
			}
	
			if (!rid) {
				do {
					rid = ridGen()
				} while (ridList.includes(rid))
			}
			const url = `https:\/\/nodechat-9dv7.onrender.com?rid=${rid}`
			window.open(url)
		})
	}
	
	function getDeviceType() {
		const ua = navigator.userAgent
		if (/Mobi|Android/i.test(ua)) {
			if (/iPad|Tablet|Nexus 7/i.test(ua)) {
				return "Tablet"
			}
			return "Mobile"
		}
		return "Desktop"
	}
	
	if (getDeviceType() === "Mobile") {
		document.querySelector("#container").style.maxWidth = "90%"
		document.querySelector("#description").style.fontSize = "1.5rem"
		document.querySelector("#description").style.textAlign = "left"
		document.querySelector("#makeRoom").style.fontSize = "2.5rem"
	}
	</script>
</body>
</html>
